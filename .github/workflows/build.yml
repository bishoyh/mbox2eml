name: Build and Release

# Every push and PR builds and tests on all three platforms (continuous
# integration). Pushing a semver tag like v1.42.0 additionally cuts a GitHub
# Release and attaches the per-platform binaries.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: choco install make --no-progress
        shell: pwsh

      - name: Build
        run: make
        shell: bash

      - name: Test
        # The regression suite is a bash script that relies on POSIX file
        # permissions (chmod), so it only runs on the Unix runners.
        if: runner.os != 'Windows'
        run: make test
        shell: bash

      - name: Stage binary
        run: |
          mkdir -p artifacts
          if [ "${{ runner.os }}" == "Windows" ]; then
            cp mbox2eml.exe artifacts/mbox2eml-windows.exe
          elif [ "${{ runner.os }}" == "macOS" ]; then
            cp mbox2eml artifacts/mbox2eml-macos
          else
            cp mbox2eml artifacts/mbox2eml-linux
          fi
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.os }}-binary
          path: artifacts/

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-binaries

      - name: Create release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            release-binaries/ubuntu-latest-binary/mbox2eml-linux
            release-binaries/macos-latest-binary/mbox2eml-macos
            release-binaries/windows-latest-binary/mbox2eml-windows.exe
